name: Build firmware
on:
  workflow_dispatch:

permissions:
  contents: write          # дозвіл workflow комітити в репозиторій

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32
          path: .

      - name: Copy firmware to firmware_esp32
        run: |
          ls -la build/*.bin
          mkdir -p firmware_esp32
          cp build/esp32_nat_router.bin           firmware_esp32/
          cp build/bootloader/bootloader.bin      firmware_esp32/
          cp build/partition_table/partition-table.bin firmware_esp32/
          cp build/ota_data_initial.bin           firmware_esp32/

      - name: Commit firmware
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add firmware_esp32
          git commit -m "Build firmware" || echo "Nothing to commit"
          git pull --rebase
          git push
